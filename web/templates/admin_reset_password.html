<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>PhishGuard | Reset Admin Password</title>
<style>
:root{color-scheme:dark;--line:#26344c;--muted:#91a0b8;--text:#f5f7fb;--accent:#8b7cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 20% 0%,#1c2850 0,transparent 45%),#080d18;font:15px Inter,system-ui,sans-serif;color:var(--text)}.card{width:min(100%,440px);padding:clamp(22px,6vw,36px);border:1px solid var(--line);border-radius:22px;background:rgba(17,26,43,.96);box-shadow:0 24px 80px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#7465ff,#31b6c9);font-weight:900}.eyebrow{font-size:11px;letter-spacing:2px;color:#a99fff;font-weight:700}h1{font-size:clamp(23px,6vw,28px);margin:9px 0}p{color:var(--muted);line-height:1.6;margin:0 0 22px}label{display:block;font-size:11px;letter-spacing:1px;font-weight:700;color:#b8c4d8;margin:17px 0 8px}input{width:100%;min-height:48px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#0a1221;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b7cff25}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:linear-gradient(100deg,#7869ff,#4d9dff);color:white;font-weight:800;font-size:14px;cursor:pointer;min-height:48px}button:disabled{opacity:.6;cursor:wait}.message{min-height:24px;margin:14px 0 0;color:#a9c6ff;font-size:13px;line-height:1.5}.back{display:block;margin-top:20px;text-align:center;color:#a99fff;text-decoration:none;font-size:13px}.foot{margin-top:24px;font-size:12px;color:#71809a;text-align:center}@media(max-width:420px){body{padding:12px}.card{border-radius:16px}}
@media(max-width:480px){body{min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}.card{width:100%;padding:clamp(20px,6vw,27px) 19px;border-radius:17px}h1{font-size:clamp(22px,7vw,27px)}input{font-size:16px}button{min-height:48px}}@media(max-height:620px){body{align-items:start}.card{margin:auto 0}}button,input{touch-action:manipulation}</style></head><body><main class="card"><div class="brand"><div class="mark">PG</div><div><div class="eyebrow">PHISHGUARD SECURITY</div><strong>Owner workspace</strong></div></div><div class="eyebrow">SECURE ADMIN RECOVERY</div><h1>Choose a new password</h1><p>This link is only for the verified PhishGuard owner account. It expires after 30 minutes and can be used once.</p><form id="resetForm"><label for="password">NEW PASSWORD</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirmPassword">CONFIRM NEW PASSWORD</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="submit" type="submit">Update admin password</button><div class="message" id="message" role="status" aria-live="polite"></div></form><a class="back" href="/admin/login">← Back to owner sign in</a><div class="foot">Private administration area · PhishGuard</div></main>
<script>
const $=id=>document.getElementById(id);let csrfToken="";async function getCsrf(){const r=await fetch("/api/auth/csrf",{credentials:"same-origin",cache:"no-store"});const d=await r.json();if(!r.ok||!d.csrf_token)throw new Error("Could not start a secure session. Refresh and try again.");csrfToken=d.csrf_token;}function readToken(){return new URLSearchParams(location.hash.slice(1)).get("token")||"";}
$("resetForm").addEventListener("submit",async e=>{e.preventDefault();const password=$("password").value,confirm=$("confirmPassword").value,token=readToken(),message=$("message"),button=$("submit");if(password.length<12||password.length>128){message.textContent="Password must contain 12 to 128 characters.";return;}if(password!==confirm){message.textContent="The passwords do not match.";return;}if(!token){message.textContent="The reset token is missing. Open the latest link from your email.";return;}button.disabled=true;message.textContent="Updating admin password…";try{if(!csrfToken)await getCsrf();const r=await fetch("/api/admin/password-reset/confirm",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify({token,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not update password.");history.replaceState(null,"",location.pathname);message.textContent=d.message||"Password updated.";setTimeout(()=>location.assign("/admin/login"),900);}catch(err){message.textContent=err.message;button.disabled=false;}});getCsrf().catch(e=>$("message").textContent=e.message);
</script></body></html>
