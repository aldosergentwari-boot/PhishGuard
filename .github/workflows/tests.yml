name: Python tests

on:
  push:
    branches:
      - main
      - "fixes/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Check dashboard JavaScript syntax
        run: |
          node --check web/static/js/script.js
          node --check web/static/js/subscription_request.js
          node --check web/static/js/subscription_requests_admin.js
